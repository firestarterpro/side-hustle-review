<style>

  .source-toggle{

</style>

const CATS = DATA.cats;
const IDEAS = DATA.ideas;

// ---- CONFIG: paste your Google Apps Script Web App URL here to auto-record votes to a Sheet ----
const CONFIG = {
  SHEET_WEBHOOK_URL: "" // e.g. "https://script.google.com/macros/s/XXXXXXXX/exec"
};

const STORAGE_KEY = "sideHustleReview_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { name:"", ratings:{}, activeView:"browse", activeCategory:"all", searchTerm:"", swipeIndex:0 };
}
let state = loadState();

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function getRating(num){
  return state.ratings[num] || { stars:0, notes:"" };
}
function setRating(num, patch){
  const cur = getRating(num);
  state.ratings[num] = Object.assign({}, cur, patch);
  saveState();
}

function showToast(msg){
  const t = document.getElementById("toastMsg");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function perplexityUrl(idea){
  const q = `Is "${idea.name}" -- ${idea.summary} -- a realistic side income opportunity in the Dallas area? What are realistic costs, risks, and legitimacy concerns?`;
  return "https://www.perplexity.ai/search?q=" + encodeURIComponent(q);
}

// ---- Sheet sync ----
let syncTimer = null;
function sendRowToSheet(idea, rating){
  if(!CONFIG.SHEET_WEBHOOK_URL) return;
  const payload = {
    timestamp: new Date().toISOString(),
    name: state.name || "",
    ideaNum: idea.num,
    ideaName: idea.name,
    category: CATS[idea.category].label,
    stars: rating.stars,
    notes: rating.notes || ""
  };
  fetch(CONFIG.SHEET_WEBHOOK_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(()=>{});
}
function debouncedSend(idea, rating){
  sendRowToSheet(idea, rating);
}

function syncAllVotes(){
  const rated = IDEAS.filter(i => (state.ratings[i.num] || {}).stars > 0);
  if(!CONFIG.SHEET_WEBHOOK_URL){
    showToast("No sheet connected yet -- ask Kenneth to finish setup. Your picks are saved on this device.");
    return;
  }
  if(rated.length === 0){
    showToast("Rate at least one idea first!");
    return;
  }
  rated.forEach(i => sendRowToSheet(i, getRating(i.num)));
  showToast(`Sent ${rated.length} rated idea${rated.length>1?'s':''} to Kenneth's sheet!`);
}

function buildCopyText(){
  const rated = IDEAS.filter(i => (state.ratings[i.num] || {}).stars > 0);
  if(rated.length === 0) return "No ideas rated yet.";
  const who = state.name ? state.name : "Someone";
  let out = `${who}'s picks:\n`;
  rated.sort((a,b)=> (getRating(b.num).stars - getRating(a.num).stars));
  rated.forEach(i=>{
    const r = getRating(i.num);
    out += `${i.num}. ${i.name} - ${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}`;
    if(r.notes) out += ` (note: ${r.notes})`;
    out += "\n";
  });
  return out;
}

function copyPicks(){
  const text = buildCopyText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast("Copied! Paste it into a text to Kenneth.")).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); showToast("Copied! Paste it into a text to Kenneth."); }
  catch(e){ showToast("Couldn't copy automatically -- select & copy manually."); }
  document.body.removeChild(ta);
}

// ---- Star widget ----
function renderStars(idea, container){
  container.innerHTML = "";
  const rating = getRating(idea.num);
  for(let s=1; s<=5; s++){
    const span = document.createElement("span");
    span.className = "star" + (s <= rating.stars ? " filled" : "");
    span.textContent = s <= rating.stars ? "★" : "☆";
    span.dataset.value = s;
    span.addEventListener("click", ()=>{
      const r = getRating(idea.num);
      const newVal = (r.stars === s) ? 0 : s; // click same star to clear
      setRating(idea.num, { stars:newVal });
      renderStars(idea, container);
      debouncedSend(idea, getRating(idea.num));
    });
    container.appendChild(span);
  }
}

// ---- Card builder (shared by browse + swipe) ----
function buildCardBody(idea){
  const wrap = document.createElement("div");

  const topLine = document.createElement("div");
  topLine.className = "top-line";
  const h3 = document.createElement("h3");
  h3.innerHTML = `<span class="num">#${idea.num}</span> ${idea.name}`;
  topLine.appendChild(h3);
  const badge = document.createElement("span");
  badge.className = "score-badge";
  badge.textContent = idea.score + "%";
  topLine.appendChild(badge);
  wrap.appendChild(topLine);

  if(idea.flag){
    const flagEl = document.createElement("div");
    flagEl.className = "flag-badge";
    flagEl.textContent = "⚠️ " + idea.flag;
    wrap.appendChild(flagEl);
  }

  const summary = document.createElement("p");
  summary.className = "summary";
  summary.textContent = idea.summary;
  wrap.appendChild(summary);

  const action = document.createElement("p");
  action.className = "action";
  action.textContent = "Action: " + idea.action;
  wrap.appendChild(action);

  const costs = document.createElement("div");
  costs.className = "costs";
  costs.innerHTML = `<span>30d: <strong>${idea.cost30}</strong></span><span>60d: <strong>${idea.cost60}</strong></span><span>90d: <strong>${idea.cost90}</strong></span>`;
  wrap.appendChild(costs);

  const starsDiv = document.createElement("div");
  starsDiv.className = "stars";
  wrap.appendChild(starsDiv);
  renderStars(idea, starsDiv);

  const noteToggle = document.createElement("button");
  noteToggle.className = "note-toggle";
  const existingNote = getRating(idea.num).notes;
  noteToggle.textContent = existingNote ? "✏️ Edit note" : "✏️ Add a note (optional)";
  wrap.appendChild(noteToggle);

  const noteArea = document.createElement("textarea");
  noteArea.className = "note";
  noteArea.placeholder = "Why do you like it / questions / concerns...";
  noteArea.style.display = existingNote ? "block" : "none";
  noteArea.value = existingNote || "";
  noteToggle.addEventListener("click", ()=>{
    noteArea.style.display = noteArea.style.display === "none" ? "block" : "none";
    if(noteArea.style.display === "block") noteArea.focus();
  });
  noteArea.addEventListener("blur", ()=>{
    setRating(idea.num, { notes: noteArea.value });
    debouncedSend(idea, getRating(idea.num));
  });
  wrap.appendChild(noteArea);

  const actionsRow = document.createElement("div");
  actionsRow.className = "card-actions";
  const verifyLink = document.createElement("a");
  verifyLink.className = "verify-link";
  verifyLink.href = perplexityUrl(idea);
  verifyLink.target = "_blank";
  verifyLink.rel = "noopener";
  verifyLink.textContent = "🔎 Verify with Perplexity";
  actionsRow.appendChild(verifyLink);
  wrap.appendChild(actionsRow);

  const sources = document.createElement("div");
  sources.className = "sources";
  sources.textContent = "Sourced from: " + idea.sources;
  wrap.appendChild(sources);

  const sourceToggle = document.createElement("button");
  sourceToggle.className = "source-toggle";
  sourceToggle.textContent = "📄 View full source data";
  wrap.appendChild(sourceToggle);

  const sourcePanel = document.createElement("div");
  sourcePanel.className = "source-panel";
  sourcePanel.textContent = (typeof SOURCE_DATA !== "undefined" && SOURCE_DATA[idea.num])
    ? SOURCE_DATA[idea.num]
    : "Source data for this idea has not been attached yet.";
  sourceToggle.addEventListener("click", () => {
    sourcePanel.classList.toggle("open");
    sourceToggle.textContent = sourcePanel.classList.contains("open")
      ? "📄 Hide source data" : "📄 View full source data";
  });
  wrap.appendChild(sourcePanel);

  return wrap;
}

// ---- Browse view ----
function renderCategoryFilters(){
  const el = document.getElementById("categoryFilters");
  el.innerHTML = "";
  const allChip = document.createElement("button");
  allChip.className = "chip" + (state.activeCategory === "all" ? " active" : "");
  allChip.textContent = "All";
  allChip.addEventListener("click", ()=>{ state.activeCategory = "all"; saveState(); renderBrowse(); renderCategoryFilters(); });
  el.appendChild(allChip);
  Object.keys(CATS).forEach(key=>{
    const chip = document.createElement("button");
    chip.className = "chip" + (state.activeCategory === key ? " active" : "");
    chip.textContent = CATS[key].emoji + " " + CATS[key].label;
    chip.addEventListener("click", ()=>{ state.activeCategory = key; saveState(); renderBrowse(); renderCategoryFilters(); });
    el.appendChild(chip);
  });
}

function renderBrowse(){
  const list = document.getElementById("browseList");
  list.innerHTML = "";
  const term = (state.searchTerm || "").toLowerCase();
  const byCategory = {};
  Object.keys(CATS).forEach(k=>byCategory[k]=[]);
  let anyMatch = false;
  IDEAS.forEach(idea=>{
    if(state.activeCategory !== "all" && idea.category !== state.activeCategory) return;
    if(term && !(idea.name.toLowerCase().includes(term) || idea.summary.toLowerCase().includes(term))) return;
    byCategory[idea.category].push(idea);
    anyMatch = true;
  });
  if(!anyMatch){
    const msg = document.createElement("div");
    msg.className = "empty-msg";
    msg.textContent = "No ideas match that search/filter.";
    list.appendChild(msg);
    return;
  }
  Object.keys(CATS).forEach(key=>{
    const ideasInCat = byCategory[key];
    if(ideasInCat.length === 0) return;
    const heading = document.createElement("div");
    heading.className = "category-heading";
    heading.textContent = CATS[key].emoji + " " + CATS[key].label;
    list.appendChild(heading);
    const grid = document.createElement("div");
    grid.className = "grid";
    ideasInCat.forEach(idea=>{
      const card = document.createElement("div");
      card.className = "card";
      card.id = "card-" + idea.num;
      card.appendChild(buildCardBody(idea));
      grid.appendChild(card);
    });
    list.appendChild(grid);
  });
}

// ---- Swipe view ----
function renderSwipe(){
  const idx = Math.min(Math.max(state.swipeIndex, 0), IDEAS.length - 1);
  state.swipeIndex = idx;
  saveState();
  const idea = IDEAS[idx];
  document.getElementById("swipeProgress").textContent = `Idea ${idx+1} of ${IDEAS.length}`;
  const cardEl = document.getElementById("swipeCard");
  cardEl.innerHTML = "";
  const pill = document.createElement("div");
  pill.className = "cat-pill";
  pill.textContent = CATS[idea.category].emoji + " " + CATS[idea.category].label;
  cardEl.appendChild(pill);
  cardEl.appendChild(buildCardBody(idea));
}

function goToIdeaInBrowse(num){
  state.activeView = "browse";
  state.activeCategory = "all";
  saveState();
  switchView("browse");
  setTimeout(()=>{
    const el = document.getElementById("card-" + num);
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  }, 60);
}

// ---- View switching ----
function switchView(view){
  state.activeView = view;
  saveState();
  document.getElementById("browseView").style.display = view === "browse" ? "block" : "none";
  document.getElementById("swipeView").style.display = view === "swipe" ? "block" : "none";
  document.getElementById("btnBrowse").classList.toggle("active", view === "browse");
  document.getElementById("btnSwipe").classList.toggle("active", view === "swipe");
  if(view === "swipe") renderSwipe();
}

// ---- Wire up events ----
document.getElementById("nameInput").value = state.name || "";
document.getElementById("nameInput").addEventListener("input", (e)=>{ state.name = e.target.value; saveState(); });

document.getElementById("btnBrowse").addEventListener("click", ()=>switchView("browse"));
document.getElementById("btnSwipe").addEventListener("click", ()=>switchView("swipe"));

document.getElementById("searchInput").addEventListener("input", (e)=>{
  state.searchTerm = e.target.value; saveState(); renderBrowse();
});

document.getElementById("swipePrev").addEventListener("click", ()=>{
  state.swipeIndex = Math.max(0, state.swipeIndex - 1); renderSwipe();
});
document.getElementById("swipeNext").addEventListener("click", ()=>{
  state.swipeIndex = Math.min(IDEAS.length - 1, state.swipeIndex + 1); renderSwipe();
});
document.addEventListener("keydown", (e)=>{
  if(state.activeView !== "swipe") return;
  if(e.key === "ArrowLeft") document.getElementById("swipePrev").click();
  if(e.key === "ArrowRight") document.getElementById("swipeNext").click();
});

document.getElementById("btnCopy").addEventListener("click", copyPicks);
document.getElementById("btnSync").addEventListener("click", syncAllVotes);

// ---- Init ----
renderCategoryFilters();
renderBrowse();
switchView(state.activeView || "browse");
</script>
